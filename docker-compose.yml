version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:7.0
    container_name: user-crud-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - user-crud-network

  # User CRUD API service
  user-crud-api:
    build: .
    container_name: user-crud-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017
      DB_NAME: userdb
      PORT: 8080
    depends_on:
      - mongodb
    networks:
      - user-crud-network

volumes:
  mongodb_data:

networks:
  user-crud-network:
    driver: bridge
